name = "cnf-sg"
main = ".open-next/worker.js"
compatibility_date = "2026-05-03"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Not secrets — public identifiers (not credentials) for
# app/api/sanity-webhook/route.ts. The actual bot token is a secret
# (wrangler secret put DISCORD_BOT_TOKEN), separate.
[vars]
DISCORD_APP_ID = "1548996339751325830"
DISCORD_SERVER_ID = "981513650533695498"
DISCORD_EVENTS_CHANNEL_ID = "981528922476929125"
OG_GENERATOR_URL = "https://cnf-og-generator.criticalsandfumbles.workers.dev/generate/event"

[[r2_buckets]]
binding = "NEXT_INC_CACHE_R2_BUCKET"
bucket_name = "cnf-website-cache"

[[r2_buckets]]
binding = "OG_IMAGES_BUCKET"
bucket_name = "cnf-website-og-images"
